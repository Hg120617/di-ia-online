<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ĐI ỈA ONLINE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172820;color:white;font:14px system-ui;overflow:hidden;touch-action:none}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;pointer-events:none}.hud span{background:#07110ddd;padding:7px;border-radius:9px;font-weight:bold;font-size:12px}.controls{position:fixed;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;gap:8px}.buttons{display:grid;grid-template-columns:repeat(3,55px);gap:5px}button{border:0;border-radius:12px;color:white;font-weight:bold;background:#345;padding:9px 3px;min-height:49px;touch-action:none}.buttons button{font-size:10px}.buttons b{display:block;font-size:19px}#stick{width:110px;height:110px;border:2px solid #ffffff88;border-radius:50%;background:#ffffff22;position:relative;touch-action:none}#knob{position:absolute;width:42px;height:42px;border-radius:50%;background:#e8f1d7;left:32px;top:32px}#start,#end{position:fixed;inset:0;background:#07110bee;display:grid;place-items:center;text-align:center;padding:20px}#end{display:none}section{max-width:420px;background:#20372b;padding:24px;border-radius:20px}h1{color:#c8ed9d}#start button,#end button{background:#c8ed9d;color:#142018;padding:14px 22px;font-size:16px}
</style>
<canvas id="c"></canvas><div class="hud"><span id="hp">❤️ 100 HP</span><span id="xp">Cấp 1 · XP 0</span><span id="alive">30 còn sống</span><span id="zone">Bo 100%</span></div>
<div class="controls"><div id="stick"><div id="knob"></div></div><div class="buttons">
<button id="poo" style="background:#87452e"><b>💩</b>NÉM CỨT</button><button id="heal" style="background:#28794b"><b>🧻</b>CHÙI ĐÍT</button><button id="trap" style="background:#9b5c27"><b>🪤</b>ĐẶT BẪY</button><button id="run"><b>⚡</b>CHẠY</button><button id="toilet" style="background:#66508b"><b>🚽</b>NHÀ CẦU</button><button id="med" style="background:#34756e"><b>💊</b>THUỐC</button></div></div>
<div id="start"><section><h1>ĐI ỈA ONLINE</h1><b>BATTLE ROYALE · 30 NGƯỜI</b><p>Góc nhìn thứ nhất · Bệnh viện bỏ hoang · Nhảy dù · Vòng bo · Bẫy ỉa chảy.</p><p>Joystick trái để di chuyển, vuốt màn hình để xoay camera.</p><button id="go">BẮT ĐẦU</button></section></div><div id="end"><section><h1 id="endtitle">BẠN ĐÃ BỊ LOẠI</h1><p id="endtext"></p><button id="again">CHƠI LẠI</button></section></div>
<script>
(()=>{const $=x=>document.getElementById(x),c=$('c'),g=c.getContext('2d');let W,H,D,player,bots,food,traps,shots,ang,hp,xp,lv,zone,t,alive,slow,meds,inside,cd,hd,td,move={x:0,y:0},run=false,started=false,last=0,drop=3;
function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.5);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function reset(){player={x:50,y:50};ang=0;hp=100;xp=0;lv=1;zone=1;t=0;alive=true;slow=inside=cd=hd=td=0;meds=1;drop=3;bots=Array.from({length:29},()=>({x:rnd(5,95),y:rnd(5,95),a:rnd(0,6.28),hp:100,ok:true}));food=Array.from({length:45},()=>({x:rnd(4,96),y:rnd(4,96),ok:true}));traps=[];shots=[];$('end').style.display='none'}
function msg(s){$('xp').textContent=s}function wall(x,y){return x<1||y<1||x>99||y>99}
function gain(n){xp+=n;if(xp>=100){xp-=100;lv++;hp=Math.min(100,hp+20);msg('LÊN CẤP '+lv+'!')}}
function poo(){if(cd>0)return;cd=1.2;shots.push({x:player.x,y:player.y,a:ang,t:1.2});msg('💩 ĐÃ NÉM CỨT!')}
function heal(){if(hd>0)return;hd=5;hp=Math.min(100,hp+30);msg('🧻 HỒI 30 MÁU')}
function trap(){if(td>0)return;if(traps.filter(a=>a.owner).length>=3)return msg('TỐI ĐA 3 BẪY');traps.push({x:player.x+Math.cos(ang)*1.4,y:player.y+Math.sin(ang)*1.4,t:90,owner:true});td=15;msg('ĐÃ ĐẶT BẪY')}
function update(dt){if(!alive||!started)return;if(drop>0){drop-=dt;return}t+=dt;cd=Math.max(0,cd-dt);hd=Math.max(0,hd-dt);td=Math.max(0,td-dt);slow=Math.max(0,slow-dt);inside=Math.max(0,inside-dt);let sp=(run?5:3)*dt*(slow?0.4:1),f=-move.y,s=move.x,dx=(Math.cos(ang)*f-Math.sin(ang)*s)*sp,dy=(Math.sin(ang)*f+Math.cos(ang)*s)*sp;if(!wall(player.x+dx,player.y))player.x+=dx;if(!wall(player.x,player.y+dy))player.y+=dy;
traps.forEach(a=>{if(a.t>0&&dist(player,a)<.8){a.t=0;slow=10;msg('DÍNH BẪY! ỈA CHẢY 10 GIÂY')}});bots.forEach(b=>{if(!b.ok)return;b.a+=rnd(-1,1)*dt;b.x+=Math.cos(b.a)*dt*.6;b.y+=Math.sin(b.a)*dt*.6;if(wall(b.x,b.y))b.a+=Math.PI;traps.forEach(a=>{if(a.t>0&&dist(a,b)<.8){a.t=0;b.slow=10}});if(dist(b,player)<1.2&&inside<=0&&Math.random()<dt*.25)hp-=3});
food.forEach(a=>{if(a.ok&&dist(a,player)<1){a.ok=false;gain(25);hp=Math.min(100,hp+5);msg('NHẶT ĐƯỢC THỨC ĂN')}});shots.forEach(s=>{s.x+=Math.cos(s.a)*dt*14;s.y+=Math.sin(s.a)*dt*14;s.t-=dt;bots.forEach(b=>{if(b.ok&&dist(s,b)<.8){b.hp-=50;s.t=0;if(b.hp<=0){b.ok=false;gain(30)}}})});shots=shots.filter(s=>s.t>0);traps.forEach(a=>a.t-=dt);traps=traps.filter(a=>a.t>0);zone=Math.max(.2,1-t/200);if(inside<=0&&dist(player,{x:50,y:50})>zone*45)hp-=dt*5;if(hp<=0){alive=false;$('endtitle').textContent='BẠN ĐÃ BỊ LOẠI';$('end').style.display='grid'}if(bots.every(b=>!b.ok)){alive=false;$('endtitle').textContent='🏆 CHIẾN THẮNG';$('end').style.display='grid'}
$('hp').textContent='❤️ '+Math.max(0,Math.floor(hp))+' HP'+(slow?' · ỈA CHẢY':'');$('xp').textContent='Cấp '+lv+' · XP '+xp;$('alive').textContent=1+bots.filter(b=>b.ok).length+' còn sống';$('zone').textContent='Bo '+Math.round(zone*100)+'%'}
function draw(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#799c9b');sky.addColorStop(.52,'#b8c3a5');sky.addColorStop(.53,'#52644b');sky.addColorStop(1,'#182d24');g.fillStyle=sky;g.fillRect(0,0,W,H);let n=Math.ceil(W/3),z=[];for(let i=0;i<n;i++){let a=ang+(i/n-.5)*1.18,d=0;while(d<25){d+=.08;if(wall(player.x+Math.cos(a)*d,player.y+Math.sin(a)*d))break}z[i]=d;let h=Math.min(H,H/(d*.75)),v=Math.max(25,140-d*4);g.fillStyle=`rgb(${v*.65},${v*.8},${v*.65})`;g.fillRect(i*3,H/2-h/2,3,h)}
function sprite(o,color,label){let dx=o.x-player.x,dy=o.y-player.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx)-ang;while(a>Math.PI)a-=6.28;while(a< -Math.PI)a+=6.28;if(Math.abs(a)>.65||d<.4)return;let x=W/2+Math.tan(a)*W*.78,k=Math.max(0,Math.min(n-1,Math.floor(x/3)));if(x<0||x>W||d>z[k])return;let h=Math.min(H*.45,H/(d*1.3));g.fillStyle=color;g.fillRect(x-h*.2,H/2-h*.65,h*.4,h*.65);g.fillStyle='#efc9a6';g.beginPath();g.arc(x,H/2-h*.72,h*.14,0,7);g.fill();g.fillStyle='white';g.font='bold 11px sans-serif';g.textAlign='center';g.fillText(label,x,H/2-h*.9)}
food.forEach(a=>{if(a.ok)sprite(a,'#c6a044','🍔')});bots.forEach(b=>{if(b.ok)sprite(b,'#a94f45','BOT')});traps.forEach(a=>sprite(a,'#d39b3c','🪤'));shots.forEach(a=>sprite(a,'#79502c','💩'));let a=Math.atan2(50-player.y,50-player.x)-ang;while(a>Math.PI)a-=6.28;while(a< -Math.PI)a+=6.28;if(Math.abs(a)<.7){g.fillStyle='white';g.textAlign='center';g.font='bold 13px sans-serif';g.fillText('🚽 NHÀ CẦU',W/2+Math.tan(a)*W*.78,H*.42)}g.strokeStyle='white';g.lineWidth=2;g.beginPath();g.moveTo(W/2-8,H/2);g.lineTo(W/2+8,H/2);g.moveTo(W/2,H/2-8);g.lineTo(W/2,H/2+8);g.stroke();if(drop>0){g.fillStyle='#00100a77';g.fillRect(0,0,W,H);g.fillStyle='white';g.textAlign='center';g.font='bold 24px sans-serif';g.fillText('🪂 NHẢY DÙ '+Math.ceil(drop),W/2,H*.4)}}
function loop(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
$('go').onclick=()=>{$('start').style.display='none';started=true;reset()};$('again').onclick=reset;$('poo').onclick=poo;$('heal').onclick=heal;$('trap').onclick=trap;$('toilet').onclick=()=>{if(dist(player,{x:50,y:50})<5){inside=20;msg('TRÚ NHÀ CẦU 20 GIÂY')}else msg('HÃY ĐẾN NHÀ CẦU GIỮA BẢN ĐỒ')};$('med').onclick=()=>{if(slow&&meds){slow=0;meds--;msg('ĐÃ CHỮA KHỎI ỈA CHẢY')}else msg('THUỐC DÙNG KHI DÍNH BẪY')};$('run').onpointerdown=()=>run=true;['pointerup','pointercancel','pointerleave'].forEach(e=>$('run').addEventListener(e,()=>run=false));
let st=$('stick'),kn=$('knob'),sid=null,center;st.onpointerdown=e=>{sid=e.pointerId;st.setPointerCapture(sid);let r=st.getBoundingClientRect();center={x:r.left+r.width/2,y:r.top+r.height/2};moveStick(e)};function moveStick(e){if(sid===null)return;let dx=e.clientX-center.x,dy=e.clientY-center.y,d=Math.max(1,Math.hypot(dx,dy)),k=Math.min(32,d);kn.style.left=32+dx/d*k+'px';kn.style.top=32+dy/d*k+'px';move={x:Math.max(-1,Math.min(1,dx/32)),y:Math.max(-1,Math.min(1,dy/32))}}st.onpointermove=moveStick;['pointerup','pointercancel'].forEach(e=>st.addEventListener(e,()=>{sid=null;move={x:0,y:0};kn.style.left='32px';kn.style.top='32px'}));
let look=null,lastX=0;c.onpointerdown=e=>{look=e.pointerId;lastX=e.clientX;c.setPointerCapture(look)};c.onpointermove=e=>{if(look!==e.pointerId)return;ang+=(e.clientX-lastX)*.006;lastX=e.clientX};['pointerup','pointercancel'].forEach(e=>c.addEventListener(e,()=>look=null));reset();requestAnimationFrame(loop);
})();
</script>
