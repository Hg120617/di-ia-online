<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Toilet Online — Battle Royale 100</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142334;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:6px;pointer-events:none}.pill{background:#091522d9;border:1px solid #ffffff35;border-radius:12px;padding:8px 11px;font-weight:900;font-size:14px;min-width:70px;text-align:center}.pill small{display:block;color:#a9c0d3;font-size:10px}
#status{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#091522d9;border-radius:12px;padding:8px 13px;font-size:12px;white-space:nowrap;text-align:center}
#overlay{position:absolute;inset:0;background:linear-gradient(145deg,#07111feF,#15334ddd);display:grid;place-items:center;padding:16px}
#card{width:min(440px,95vw);background:#101d2beF;border:1px solid #ffffff35;border-radius:22px;padding:25px;text-align:center;box-shadow:0 15px 50px #0008}
h1{margin:0;color:#facc15;font-size:clamp(36px,10vw,58px);line-height:.9;text-shadow:0 4px #92400e}h2{margin:12px 0 4px;color:#86efac;letter-spacing:3px;font-size:15px}
p{color:#cbd5e1;font-size:13px;line-height:1.5}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #64748b;background:#0a1421;color:white;font-size:16px;margin:10px 0}
button{border:0;border-radius:12px;padding:14px 16px;font-weight:1000;font-size:16px;background:#22c55e;color:#062b16;cursor:pointer;touch-action:manipulation}
#start{width:100%}.muted{font-size:11px;color:#91a4b6}
#controls{position:absolute;bottom:14px;left:14px;right:14px;display:flex;align-items:end;justify-content:space-between;pointer-events:none}
#stick{width:118px;height:118px;border-radius:50%;background:#ffffff24;border:2px solid #ffffff65;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:32px;top:32px;width:50px;height:50px;border-radius:50%;background:#e2e8f0dd;box-shadow:0 3px 12px #0008}
#actions{display:flex;gap:8px;pointer-events:auto}.act{width:62px;height:62px;border-radius:50%;padding:5px;background:#facc15;color:#172033;font-size:11px;box-shadow:0 4px #a16207}
#toast{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);font-size:25px;font-weight:1000;text-align:center;text-shadow:0 3px 10px black;pointer-events:none}
#map{position:absolute;right:12px;top:120px;width:94px;height:94px;border-radius:50%;border:2px solid #fff8;background:#091522a8}
@media(min-width:850px){#controls{left:28px;right:28px}#stick{opacity:.7}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><div class="pill"><small>CÒN SỐNG</small><span id="alive">100</span></div><div class="pill"><small>BO THU HẸP</small><span id="clock">90</span>s</div><div class="pill"><small>HẠ GỤC</small><span id="kills">0</span></div></div>
<div id="status">TÌM VẬT PHẨM · VÀO VÙNG AN TOÀN</div><canvas id="map" width="188" height="188"></canvas>
<div id="controls"><div id="stick"><div id="knob"></div></div><div id="actions"><button class="act" id="sprint">CHẠY<br>NHANH</button><button class="act" id="hit">💥<br>ĐẨY</button><button class="act" id="use">🧻<br>VẬT PHẨM</button></div></div>
<div id="toast"></div>
<div id="overlay"><div id="card"><h1>TOILET<br>ONLINE</h1><h2>BATTLE ROYALE 100</h2><p>100 đấu thủ · Bản đồ 3D giả lập phối cảnh · Góc nhìn thứ ba · Vòng bo sinh tồn</p><input id="nick" maxlength="14" value="Toilet Hero" placeholder="Tên nhân vật"><button id="start">VÀO TRẬN 🚽</button><p class="muted">Bản chơi thử: 99 đối thủ AI. Chưa kết nối máy chủ để có 100 người thật.</p></div></div>
<script>
(()=>{
const cv=document.querySelector('#cv'),c=cv.getContext('2d'),map=document.querySelector('#map'),m=map.getContext('2d');let W,H,D=1;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id),rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
let player,bots=[],loot=[],hazards=[],running=false,over=false,t=0,zone=21,kills=0,score=0,sprint=0,toastT=0,joy={x:0,y:0},drag=false,keys={},last=0;
const colors=['#f97316','#a78bfa','#fb7185','#38bdf8','#eab308','#14b8a6','#ec4899','#a3e635','#c084fc'];
function announce(s){$('toast').textContent=s;toastT=1.4}
function spawn(){player={x:0,z:0,yaw:0,hp:100,name:$('nick').value.trim()||'Toilet Hero',color:'#22c55e',alive:true,attack:0,inv:0};bots=[];for(let i=0;i<99;i++)bots.push({x:rand(-19,19),z:rand(-19,19),yaw:rand(0,6.28),hp:100,alive:true,color:colors[i%colors.length],brain:rand(.5,2),name:'BOT '+(i+1),attack:rand(0,3)});loot=[];for(let i=0;i<35;i++)loot.push({x:rand(-18,18),z:rand(-18,18),type:i%3});hazards=[];for(let i=0;i<16;i++)hazards.push({x:rand(-19,19),z:rand(-19,19),r:rand(.8,1.7)});t=0;zone=21;kills=0;score=0;sprint=0;running=true;over=false;$('overlay').style.display='none';announce('TRẬN ĐẤU BẮT ĐẦU!')}
$('start').addEventListener('click',spawn);
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let st=$('stick'),knob=$('knob');
function joyMove(e){let r=st.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),max=38;if(l>max){x=x/l*max;y=y/l*max}joy.x=x/max;joy.y=y/max;knob.style.transform=`translate(${x}px,${y}px)`}
st.addEventListener('pointerdown',e=>{drag=true;st.setPointerCapture(e.pointerId);joyMove(e)});st.addEventListener('pointermove',e=>{if(drag)joyMove(e)});function joyStop(){drag=false;joy={x:0,y:0};knob.style.transform='translate(0,0)'}st.addEventListener('pointerup',joyStop);st.addEventListener('pointercancel',joyStop);
$('sprint').onclick=()=>{if(running)sprint=2.2};$('hit').onclick=attack;$('use').onclick=useItem;
function attack(){if(!running||player.attack>0)return;player.attack=.7;let target=bots.filter(b=>b.alive&&dist(player,b)<2.8).sort((a,b)=>dist(player,a)-dist(player,b))[0];if(target){target.hp-=55;if(target.hp<=0){target.alive=false;kills++;announce('ĐÃ LOẠI 1 ĐỐI THỦ!')}}else announce('ĐẨY TRƯỢT!')}
function useItem(){if(!running)return;player.hp=Math.min(100,player.hp+25);announce('🧻 DÙNG GIẤY HỒI 25 MÁU')}
function finish(win){running=false;over=true;$('overlay').style.display='grid';$('card').innerHTML=`<h1>${win?'NHÀ VÔ ĐỊCH!':'BẠN ĐÃ BỊ LOẠI'}</h1><h2>TOILET BATTLE ROYALE</h2><p>Hạ gục: <b>${kills}</b> · Điểm sinh tồn: <b>${score}</b></p><button id="again" style="width:100%">CHƠI LẠI 🚽</button><p class="muted">Bản thử nghiệm với 99 đối thủ AI.</p>`;$('again').onclick=()=>location.reload()}
function update(dt){if(!running)return;t+=dt;sprint=Math.max(0,sprint-dt);player.attack=Math.max(0,player.attack-dt);player.inv=Math.max(0,player.inv-dt);
let forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y,side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;let mag=Math.hypot(forward,side);if(mag>1){forward/=mag;side/=mag}let sp=sprint>0?9.2:5.5;player.x+=side*sp*dt;player.z-=forward*sp*dt;player.x=Math.max(-22,Math.min(22,player.x));player.z=Math.max(-22,Math.min(22,player.z));if(mag>.1)player.yaw=Math.atan2(side,forward);
bots.forEach(b=>{if(!b.alive)return;b.brain-=dt;if(b.brain<=0){b.yaw=rand(0,6.28);b.brain=rand(.7,2.5)}let speed=rand(1.4,2.5);b.x+=Math.sin(b.yaw)*speed*dt;b.z+=Math.cos(b.yaw)*speed*dt;if(Math.abs(b.x)>zone*.95)b.yaw=-b.yaw;if(Math.abs(b.z)>zone*.95)b.yaw=Math.PI-b.yaw;
if(dist(b,player)<1.15&&b.attack<=0){player.hp-=rand(3,8);b.attack=1.3;player.inv=.18}
let near=bots.find(o=>o!==b&&o.alive&&dist(o,b)<.9);if(near&&Math.random()<.02){near.hp-=15;if(near.hp<=0)near.alive=false}
});
if(t>18)zone=Math.max(5,21-(t-18)*.13);
let outside=Math.abs(player.x)>zone||Math.abs(player.z)>zone;if(outside){player.hp-=dt*10;$('status').textContent='⚠️ NGOÀI VÙNG AN TOÀN — MẤT MÁU!'}else $('status').textContent='VÙNG AN TOÀN · TÌM VẬT PHẨM';
hazards.forEach(h=>{if(dist(player,h)<h.r+.4&&player.inv<=0){player.hp-=dt*18}});
loot=loot.filter(l=>{if(dist(player,l)<1.25){if(l.type===0)player.hp=Math.min(100,player.hp+30);else if(l.type===1)sprint=4;else score+=100;return false}return true});
if(player.hp<=0)finish(false);let alive=bots.filter(b=>b.alive).length+1;$('alive').textContent=alive;$('clock').textContent=Math.max(0,Math.ceil(90-t));$('kills').textContent=kills;score+=Math.floor(dt*3);if(alive<=1||t>90)finish(true);
}
function project(x,z,y=0){let s=Math.min(W/42,H/31),cx=W/2,cy=H*.62,dx=x-player.x,dz=z-player.z;let depth=Math.max(.45,1+(dz+10)*.018);return{x:cx+dx*s*.82/depth,y:cy+(dx*.28-dz*.65)*s/depth-y*s/depth,sc:s/depth}}
function drawWorld(){c.fillStyle='#8dcbd9';c.fillRect(0,0,W,H);let horizon=H*.36;c.fillStyle='#d7e6e5';c.fillRect(0,horizon,W,H-horizon);
let p=project(0,0);c.fillStyle='#b5c9c7';c.beginPath();c.moveTo(W*.5,horizon);c.lineTo(W+80,H);c.lineTo(-80,H);c.closePath();c.fill();
// floor tile perspective
c.strokeStyle='#9bb4b5';c.lineWidth=1;for(let i=-18;i<=18;i+=3){let a=project(i,-22),b=project(i,22);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();let a2=project(-22,i),b2=project(22,i);c.beginPath();c.moveTo(a2.x,a2.y);c.lineTo(b2.x,b2.y);c.stroke()}
// distant stall walls
for(let x=-18;x<=18;x+=6){let q=project(x,-15);c.fillStyle='#3e8796';c.fillRect(q.x-25*q.sc,q.y-85*q.sc,50*q.sc,85*q.sc);c.fillStyle='#9b7654';c.fillRect(q.x-18*q.sc,q.y-65*q.sc,36*q.sc,65*q.sc)}
// zone ring ground
let z1=project(-zone,-zone),z2=project(zone,zone);c.strokeStyle='#facc15';c.lineWidth=3;c.setLineDash([10,8]);c.strokeRect(z1.x,z1.y,z2.x-z1.x,z2.y-z1.y);c.setLineDash([]);
hazards.forEach(h=>{let q=project(h.x,h.z);c.fillStyle='#38bdf888';c.beginPath();c.ellipse(q.x,q.y,h.r*q.sc*.8,h.r*q.sc*.35,0,0,7);c.fill();});
loot.forEach(l=>{let q=project(l.x,l.z);c.fillStyle=l.type===0?'#ef4444':l.type===1?'#facc15':'#f8fafc';c.fillRect(q.x-5*q.sc,q.y-12*q.sc,10*q.sc,10*q.sc)});
}
function drawChar(a,isPlayer=false){if(!a.alive)return;let q=project(a.x,a.z),s=q.sc;c.fillStyle='#0004';c.beginPath();c.ellipse(q.x,q.y,13*s,5*s,0,0,7);c.fill();c.fillStyle=a.color;c.beginPath();c.ellipse(q.x,q.y-23*s,11*s,18*s,0,0,7);c.fill();c.fillStyle='#ffd3ad';c.beginPath();c.arc(q.x,q.y-48*s,10*s,0,7);c.fill();c.fillStyle='#172033';c.beginPath();c.arc(q.x-3*s,q.y-50*s,1.4*s,0,7);c.arc(q.x+3*s,q.y-50*s,1.4*s,0,7);c.fill();if(isPlayer){c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(q.x,q.y-23*s,15*s,0,7);c.stroke()}}
function drawMap(){m.clearRect(0,0,188,188);m.fillStyle='#22384a';m.fillRect(0,0,188,188);m.strokeStyle='#facc15';m.lineWidth=2;m.strokeRect(94-zone*4.2,94-zone*4.2,zone*8.4,zone*8.4);bots.forEach(b=>{if(!b.alive)return;m.fillStyle='#fb7185';m.fillRect(94+b.x*4-1,94+b.z*4-1,3,3)});m.fillStyle='#4ade80';m.beginPath();m.arc(94+player.x*4,94+player.z*4,4,0,7);m.fill()}
function render(){drawWorld();let actors=[...bots,player].filter(a=>a.alive).sort((a,b)=>a.z-b.z);actors.forEach(a=>drawChar(a,a===player));drawMap();if(running){let hp=Math.max(0,player.hp);c.fillStyle='#0008';c.fillRect(W/2-70, H-145,140,8);c.fillStyle=hp>50?'#4ade80':'#fb7185';c.fillRect(W/2-70,H-145,140*hp/100,8);c.fillStyle='white';c.font='bold 11px system-ui';c.textAlign='center';c.fillText('HP '+Math.ceil(hp),W/2,H-150)}}
function loop(now){let dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);render();if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').textContent=''}requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
